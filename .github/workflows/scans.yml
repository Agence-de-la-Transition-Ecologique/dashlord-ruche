name: DashLord scans

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Single url to scan or scan all urls"
        required: false
        default: ""
      tool:
        description: "Single tool to run or use all tools"
        type: choice
        default: all
        options:
          - all
          - codescan
          - dependabot
          - ecoindex
          - lighthouse
          - sonarcloud
          - trivy
          - zap
          - ecoindex
          - dsfr
  push:
    branches:
      - master
      - main
    paths:
      - "dashlord.yaml"
      - "dashlord.yml"
      - "urls.txt"
  schedule:
    - cron: "0 0 * * 0" # see https://crontab.guru

permissions:
  contents: write
  
# allow only one concurrent scan action
concurrency:
  cancel-in-progress: true
  group: scans

jobs:
  init:
    runs-on: ubuntu-latest
    name: Prepare
    outputs:
      sites: ${{ steps.init.outputs.sites }}
      config: ${{ steps.init.outputs.config }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: init
        uses: SocialGouv/dashlord-actions/init@20b2f87135667b379650473197967515e6ca85b8 # v1
        with:
          url: ${{ github.event.inputs.url }}
          tool: ${{ github.event.inputs.tool }}
        # to create missing entries in updown.io
      - id: updown-init
        if: ${{ matrix.sites.tools.updownio }}
        uses: SocialGouv/dashlord-actions/updown-init@20b2f87135667b379650473197967515e6ca85b8 # v1
        env:
          UPDOWNIO_API_KEY: ${{ secrets.UPDOWNIO_API_KEY }}
  scans:
    runs-on: [self-hosted, dashlord]
    name: Scan
    needs: init
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sites: ${{ fromJson(needs.init.outputs.sites) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}

      - run: |
          mkdir scans

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - name: dsfr
        continue-on-error: true
        timeout-minutes: 10
        uses: socialgouv/dashlord-actions/dsfr@20b2f87135667b379650473197967515e6ca85b8 # v1
        if: ${{ matrix.sites.tools.dsfr }}
        with:
          url: ${{ matrix.sites.url }}
          output: scans/dsfr.json

      - name: sonarcloud scan
        if: ${{ matrix.sites.tools.sonarcloud }}
        id: sonarcloud
        continue-on-error: true
        timeout-minutes: 10
        uses: SocialGouv/dashlord-actions/sonarcloud@20b2f87135667b379650473197967515e6ca85b8 # v1
        with:
          repos: ${{ join(matrix.sites.repositories) }}
          output: "scans/sonarcloud.json"

      - name: Third-party scripts scan
        if: ${{ matrix.sites.tools.thirdparties }}
        id: thirdparties
        continue-on-error: true
        timeout-minutes: 10
        uses: SocialGouv/thirdparties-action@1b300469533848e2d11dc904eb016b0b82229364 # master
        with:
          url: "${{ matrix.sites.url }}"
          output: "scans/thirdparties.json"

      - name: Déclaration a11y
        timeout-minutes: 10
        uses: socialgouv/dashlord-actions/declaration-a11y@20b2f87135667b379650473197967515e6ca85b8 # v1
        if: ${{ matrix.sites.tools['declaration-a11y'] }}
        with:
          url: ${{ matrix.sites.url }}
          output: scans/declaration-a11y.json

      - name: eco-index
        continue-on-error: true
        timeout-minutes: 10
        uses: socialgouv/dashlord-actions/ecoindex@20b2f87135667b379650473197967515e6ca85b8 # v1
        if: ${{ matrix.sites.tools.ecoindex }}
        with:
          url: ${{ matrix.sites.url }}
          output: scans/ecoindex.json

      - name: Déclaration RGPD
        timeout-minutes: 10
        uses: SocialGouv/dashlord-actions/declaration-rgpd@20b2f87135667b379650473197967515e6ca85b8 # v1
        if: ${{ matrix.sites.tools['declaration-rgpd'] }}
        with:
          thirdparties: ${{ steps.thirdparties.outputs.json }}
          url: ${{ matrix.sites.url }}
          output: scans/declaration-rgpd.json

      - name: Trivy
        continue-on-error: true
        timeout-minutes: 20
        if: ${{ matrix.sites.tools.trivy && matrix.sites.docker }}
        uses: socialgouv/dashlord-actions/trivy@20b2f87135667b379650473197967515e6ca85b8 # v1
        with:
          images: ${{ join(matrix.sites.docker) }}
          output: scans/trivy.json

      - name: Detect 404s
        continue-on-error: true
        timeout-minutes: 10
        uses: socialgouv/detect-404-action@d9cfb10876e3403195e7cc2a306d2b166d1792b8 # master
        if: ${{ matrix.sites.tools['404'] }}
        with:
          url: ${{ matrix.sites.url }}
          output: scans/404.json

      - name: Betagouv API scan
        if: ${{ matrix.sites.tools.betagouv }}
        continue-on-error: true
        timeout-minutes: 10
        id: betagouv
        uses: betagouv/dashlord-startup-action@93cbc26a096e16ca9b285e7e23b80f5535604ba6 # main
        with:
          id: "${{ matrix.sites.betaId }}"
          output: "scans/betagouv.json"

      - name: Stats page
        timeout-minutes: 10
        uses: betagouv/check-url-action@4abfd436fe4cbe5f064f17cb969ce6194b0bc716 # main
        if: ${{ matrix.sites.tools.stats }}
        with:
          url: ${{ steps.betagouv.outputs.stats_url || format('{0}/stats', matrix.sites.url) }}
          output: scans/stats.json
          minExpectedRegex: ^stat
          exactExpectedRegex: ^stats$

      - name: Screenshot Website
        uses: swinton/screenshot-website@5fcf4889015d277ef5e9635eba1fd1c2304a0d3e # v1.x
        if: ${{ matrix.sites.tools.screenshot }}
        timeout-minutes: 5
        continue-on-error: true
        with:
          source: "${{ matrix.sites.url }}"
          type: jpeg
          destination: screenshot.jpeg
          width: 1280
          scaleFactor: 0.5

      - name: Wappalyzer scan
        if: ${{ matrix.sites.tools.wappalyzer }}
        uses: socialgouv/wappalyzer-action@84f8eefc908ae35051802c73da6f8b1b936c2273 # master
        timeout-minutes: 10
        continue-on-error: true
        with:
          url: "${{ matrix.sites.url }}"
          output: scans/wappalyzer.json

      - name: ZAP Scan
        if: ${{ matrix.sites.tools.zap }}
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: "" # disable issue creation
          rules_file_name: "zap-rules.tsv"
          allow_issue_writing: false
          target: "${{ matrix.sites.url }}"
          cmd_options: "-a"

        # https://github.com/treosh/lighthouse-ci-action#inputs
      - name: Lighthouse scan
        if: ${{ matrix.sites.tools.lighthouse }}
        timeout-minutes: 10
        uses: socialgouv/dashlord-actions/lhci@20b2f87135667b379650473197967515e6ca85b8 # v1
        with:
          url: "${{ join(matrix.sites.subpages, ',') }}"

      - name: Mozilla HTTP Observatory
        if: ${{ matrix.sites.tools.http }}
        timeout-minutes: 10
        id: http
        continue-on-error: true
        uses: SocialGouv/httpobs-action@b1131f9d2670adf33189aa758c74545de8873378 # master
        with:
          url: "${{ matrix.sites.url }}"
          output: "scans/http.json"

      - name: Mozilla HTTP Observatory retry
        if: steps.http.outcome=='failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: SocialGouv/httpobs-action@b1131f9d2670adf33189aa758c74545de8873378 # master
        with:
          url: "${{ matrix.sites.url }}"
          output: "scans/http.json"

      # testssl.sh action needs an hostname to save its output so we build it here
      - name: Extract hostname
        id: hostname
        run: |
          HOSTNAME=$(echo "${{ matrix.sites.url }}" | sed -e 's/[^/]*\/\/\([^@]*@\)\?\([^:/]*\).*/\2/')
          echo "value=$HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: testssl.sh scan
        if: ${{ matrix.sites.tools.testssl }}
        timeout-minutes: 10
        continue-on-error: true
        uses: mbogh/test-ssl-action@4e4ac62e9e3f886675fd3f6f339524700cdb20f8 # v1.1
        with:
          host: ${{ steps.hostname.outputs.value }}
          output: scans
          grade: "F"
          options: "--fast"

      - name: Nuclei scan
        if: ${{ matrix.sites.tools.nuclei }}
        timeout-minutes: 10
        continue-on-error: true
        uses: SocialGouv/dashlord-nuclei-action@86529575387347bb63197e5f0920e965713dd054 # master
        with:
          url: ${{ matrix.sites.url }}
          output: "scans/nuclei.log"

      - name: Updown.io checks
        if: ${{ matrix.sites.tools.updownio }}
        continue-on-error: true
        uses: MTES-MCT/updownio-action@52e2d79dc7390e9a139bbce9c62ecc5aefab8cf4 # main
        with:
          apiKey: ${{ secrets.UPDOWNIO_API_KEY }}
          url: ${{ matrix.sites.url }}
          output: scans/updownio.json

      - name: Dependabot vulnerabilities alerts
        if: ${{ matrix.sites.tools.dependabot && matrix.sites.repositories }}
        continue-on-error: true
        uses: MTES-MCT/dependabotalerts-action@3d7d27756ad09279b6893a050aa79bcc5cdd3c48 # main
        with:
          token: ${{ secrets.DEPENDABOTALERTS_TOKEN }}
          repositories: ${{ join(matrix.sites.repositories) }}
          output: scans/dependabotalerts.json

      - name: Code quality alerts
        if: ${{ matrix.sites.tools.codescan && matrix.sites.repositories }}
        continue-on-error: true
        uses: MTES-MCT/codescanalerts-action@e8fe792a23b2378c1428a24de787011333a37518 # main
        with:
          token: ${{ secrets.CODESCANALERTS_TOKEN }}
          repositories: ${{ join(matrix.sites.repositories) }}
          output: scans/codescanalerts.json

      - uses: SocialGouv/dashlord-actions/save@20b2f87135667b379650473197967515e6ca85b8 # v1
        with:
          url: ${{ matrix.sites.url }}
          # only clean up previous stats when all tools runned
          cleanup: ${{ github.event.inputs.tool == 'all' && true || false }}

      - name: "Commit"
        id: commit1
        continue-on-error: true
        run: |
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config --global user.name GitHub
          git add "results"
          git commit -m "update: ${{ matrix.sites.url }}"
          git pull --rebase --no-ff origin ${{ github.ref }}
          git push

      - name: "Commit retry"
        if: steps.commit1.outcome=='failure'
        id: commit2
        continue-on-error: true
        run: |
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config --global user.name GitHub
          git add "results"
          git commit -m "update: ${{ matrix.sites.url }}"
          git pull --rebase --no-ff origin ${{ github.ref }}
          git push

      - name: "Commit retry 2"
        if: steps.commit2.outcome=='failure'
        run: |
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config --global user.name GitHub
          git add "results"
          git commit -m "update: ${{ matrix.sites.url }}"
          git pull --rebase --no-ff origin ${{ github.ref }}
          git push
